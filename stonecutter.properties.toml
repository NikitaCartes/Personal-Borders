# Top-level keys apply to every node; [<loader>."<version>"] sections to that node only.
# Build scripts read them via property("...") after properties.tags(version, loader).

# Mod
mod_name = "Personal Borders"
mod_id = "personal-borders"
mod_version = "1.0.0"

#   loader / fabric-api  https://fabricmc.net/develop/
#   neoforge_version     https://projects.neoforged.net/neoforged/neoforge
#   luckperms            https://luckperms.net/
#
# access_file names the accesswidener and the accesstransformer this node ships.
# NeoForge has no stable build for 1.21.6 or 1.21.9, so those nodes compile
# against 1.21.8 and 1.21.11 instead.

[fabric."1.21.1"]
minecraft_version = "1.21.1"
loader_version = "0.16.10"
fabric_version = "0.114.0+1.21.1"
luckperms_version = "5.4"
java_version = "21"
access_file = "personal-borders-1.21.1"
supported_minecraft_version = ">=1.21 <1.21.2"
display_name = "[1.21 - 1.21.1]"
supported_versions = "1.21,1.21.1"

