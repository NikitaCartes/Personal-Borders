modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/NikitaCartes/Personal-Borders/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
displayURL = "https://github.com/NikitaCartes/Personal-Borders"
authors = "NikitaCartes"
description = '''
Mod that adds player-specific borders to the world
'''

[[mixins]]
config = "personal-borders.mixins.json"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "SERVER"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${supported_minecraft_version}"
ordering = "NONE"
side = "SERVER"

[[dependencies.${mod_id}]]
modId = "luckperms"
type = "required"
versionRange = "*"
ordering = "AFTER"
side = "SERVER"
